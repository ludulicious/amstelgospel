items:
  - label: Hoe lang duurt een optreden?
    content: >-
      Dat bepalen we samen. Een korte bijdrage of een langer programma: de lengte sluit aan bij jouw evenement.
  - label: Hoeveel songs staan er op het programma?
    content: >-
      Dat hangt samen met de beschikbare tijd en de nummers. We kiezen samen een passende selectie.
  - label: Mag ik nummers voorstellen?
    content: >-
      Graag! Vertel ons welke muziek je in gedachten hebt. We bespreken wat past bij het koor en de gelegenheid.
  - label: Kunnen jullie een nieuw nummer leren?
    content: >-
      Geef je verzoek aan ons door. We onderzoeken of het instuderen van jouw song haalbaar is.
  - label: Waar vind ik jullie repertoire?
    content: >-
      Vraag ons naar de actuele lijst met gospel, soul, pop en ballads.
  - label: Is een ingetogen optreden ook mogelijk?
    content: >-
      Ja. We kunnen rustige en energieke muziek afwisselen, passend bij de sfeer die je zoekt.
  - label: Verzorgen jullie geluid en licht?
    content: >-
      We brengen eigen apparatuur en een vaste geluidstechnicus mee. Wij regelen ook het opbouwen en opruimen.
  - label: Wanneer kan ik het beste boeken?
    content: >-
      Neem vroeg contact op. Dan kunnen we de beschikbaarheid en invulling samen bekijken.
  - label: Wat kost een boeking?
    content: >-
      Locatie, speelduur en programma bepalen de offerte. Vertel ons je plannen voor een prijs op maat.
  - label: Kan ik vrijblijvend kennismaken?
    content: >-
      Natuurlijk. Bel of mail ons om je ideeën te bespreken.
