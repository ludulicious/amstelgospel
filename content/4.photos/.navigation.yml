title: Photos
icon: i-lucide-images
studio:
  filters:
    - field: categories
      label: Category
    - field: visible
      label: Visibility
  view: media
  media:
    directory: images
    formats: [jpg, jpeg, png, webp, gif]
    maxBytes: 10485760
    imageAspectRatio: null # default is null, which allows portrait or landscape crops.
    thumbnailAspectRatio: '4:3'
